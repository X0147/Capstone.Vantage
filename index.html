<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapstoneFlight - Premium Booking Experience</title>
    <meta name="description" content="Book your next flight with ease and elegance." />
    <!-- Preconnect & load Inter variable font for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@8..144&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If this page is being served from the repository root on GitHub Pages,
      // redirect to the project path where the built site is published.
      (function() {
        try {
          const isGhPagesHost = location.hostname === 'x0147.github.io';
          const isRepoRoot = location.pathname === '/' || location.pathname === '/index.html';
          if (isGhPagesHost && isRepoRoot) {
            location.replace('/Capstone.Vantage/');
            return;
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
